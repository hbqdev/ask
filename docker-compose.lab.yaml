name: ask-stack-lab

# Isolated third instance for flow-architecture experiments.
#
# WHY A THIRD INSTANCE: prod and staging both carry the full six-source
# retrieval stack, and tonight's measurements showed source mix and candidate
# pool composition swamp everything else — a 30x model difference and a 5x
# unique-contribution difference between sources were both large enough to
# hide any flow effect. This instance exists to make FLOW the only moving part.
#
# RETRIEVAL WAS DELIBERATELY REDUCED TO SEARXNG ALONE while the architecture
# A/B ran, so that flow was the only moving part. That job is finished and the
# source stack is now MATCHED TO STAGING (see the block below), because the
# open question changed from "which flow is better on one instance" to "how
# does the pipeline compare to what staging actually serves". Latencies here
# are therefore comparable with staging and NOT with the earlier arm runs.

services:
  ask:
    container_name: ask-lab
    environment:
      # --- which control flow to run (see lib/agents/flows) ---------------
      # The whole point of this instance. Set per experiment run.
      FLOW_VARIANT: ${FLOW_VARIANT:-baseline}

      # Per-source content budget in the pipeline's prompt (chars). The loop's
      # search tool does not truncate at all, so this is the one knob that
      # controls whether the pipeline loses information the loop keeps — the
      # leading suspect for its quality deficit. Set per experiment run;
      # unset falls back to the in-code default.
      PIPELINE_SOURCE_CHARS: ${PIPELINE_SOURCE_CHARS:-}

      # Which ARCHITECTURE to run. Deliberately a different switch from
      # FLOW_VARIANT: the variants are knobs inside the agentic loop, whereas
      # `pipeline` removes the loop — the system retrieves and the model gets
      # one call with no search tool. Unset = the inherited morphic loop.
      FLOW_ARCH: ${FLOW_ARCH:-}

      # --- isolation -------------------------------------------------------
      # Anonymous mode so the benchmark harness can POST /api/chat without a
      # browser session. Safe here and nowhere else: this instance is LAN-only,
      # has its own Postgres, and holds no real user data. It is also what
      # makes an unattended multi-hour run possible at all — the alternative is
      # ~250 browser interactions. Browser runs still happen, for UX.
      ENABLE_AUTH: 'false'
      ANONYMOUS_USER_ID: 'lab-harness'
      SEARXNG_API_URL: 'http://ask-searxng-lab:8080'
      # No fallback: a silent failover to another instance's SearXNG would
      # mean an arm was measured against a different index without saying so.
      SEARXNG_FALLBACK_API_URL: ''

      # --- SOURCE STACK: MATCHED TO STAGING -------------------------------
      # This block used to read "SearXNG ONLY, everything else off", so that
      # FLOW was the only moving part in a pipeline-vs-loop A/B on this one
      # instance. That job is done (5 measured builds, judge -16 -> +8).
      #
      # The question now is different: how does the pipeline compare to what
      # STAGING actually serves? Answering that with one source against
      # staging's five would conflate architecture with retrieval breadth —
      # the exact confound that produced two wrong conclusions earlier in this
      # work. So every source is matched to ask-admin-feature, leaving the
      # architecture as the only difference.
      #
      # NOTE this makes lab latencies incomparable with the earlier A/B runs.
      # Those compared arms on ONE instance; this compares two instances.
      DEGOOG_ENABLED: 'true'
      # Lab keeps its OWN degoog instance (:4447, its own Mullvad exit) rather
      # than sharing staging's (:4446). Deliberate: lab is the heaviest search
      # generator in the fleet, and benchmark volume must never burn the
      # reputation of the instance real users depend on. Same software, same
      # settings — a separate exit, not a different source.
      DEGOOG_API_URL: 'http://192.168.50.231:4447'
      # NOT blanked. It was, and that silently un-matched the stack this block
      # claims to match: with an empty key every degoog call returned 401, the
      # client tripped its circuit breaker, and lab ran the whole
      # staging-vs-lab comparison on FOUR sources against staging's five.
      # Measured after the fact: 5 x "degoog responded with 401" and 27 x
      # "circuit-breaker cooldown" on lab in two hours, zero on prod and
      # staging. Inherited from .env now, exactly as prod and staging inherit
      # it — a separate exit is the intended difference, a missing credential
      # is not.
      DEGOOG_API_KEY: ${DEGOOG_API_KEY:-}
      TAVILY_MERGE_ENABLED: 'on'
      # Tavily, Brave and Langsearch keys now come from .env unset-overridden,
      # i.e. inherited exactly as staging inherits them. Ollama search stays
      # off because staging has it off too — matching means matching the
      # absences as well as the presences.
      OLLAMA_SEARCH_ENABLED: 'off'
      OLLAMA_SEARCH_API_KEY: ''

      # --- held constant across every arm ----------------------------------
      # Pinned rather than inherited so an arm can never be accidentally
      # measured against a different model or pool size.
      DEFAULT_CHAT_MODEL: 'kimi-k2.6:cloud'
      SEARXNG_CRAWL_MULTIPLIER: '4'
      # 'false' since 2026-08-01, matching prod and staging. The A/B this flag
      # existed for measured it down: per-step prompt size fell only 5% — the
      # whole point of the change — while steps rose 142%, turns ran 17% slower,
      # and citation-without-support reproduced on two of two probed turns. Lab
      # pins it so an arm is never measured against retired behaviour. Result:
      # docs/superpowers/specs/2026-07-25-source-excerpts-design.md
      SEARCH_EXCERPTS_ENABLED: 'false'
      # Shell-settable so the never-run A/B can toggle arms against ONE build:
      #   SEARCH_QUALITY_FILTER=strict docker compose ... up -d ask
      # Note quality-content.ts branches only on `=== 'relaxed'`, so ANY other
      # value ('strict', unset, a typo) selects the strict path. The A/B is
      # therefore relaxed-vs-not-relaxed; 'strict' is a label, not a mode.
      SEARCH_QUALITY_FILTER: ${SEARCH_QUALITY_FILTER:-relaxed}
      # Pre-crawl snippet gate. 'on' enforces, 'shadow' scores without acting,
      # anything else is off (snippet-gate.ts:32). Phase 2 of
      # docs/superpowers/specs/2026-07-26-snippet-gate-design.md was specified
      # and never measured; shell-settable so it can be.
      SEARCH_SNIPPET_GATE: ${SEARCH_SNIPPET_GATE:-off}
      SEARCH_SNIPPET_GATE_TOP_N: ${SEARCH_SNIPPET_GATE_TOP_N:-40}
      # Pin the image EDIT model (registry.ts pickPinnedModel) to one consistent,
      # strong editor instead of round-robining the whole pool — edits kept
      # drifting in style/identity/resolution turn-to-turn. Generation still
      # rotates (variety). nano-banana-2: fast (~20s), renowned for editing,
      # preserves the subject, PNG + match_input_image (keeps source shape).
      # (gpt-image-2 was tried first but times out >120s at usable quality.)
      # Shell-overridable; unset falls back to rotation.
      REPLICATE_IMAGE_EDIT_MODEL: ${REPLICATE_IMAGE_EDIT_MODEL:-google/nano-banana-2}
      CLASSIFIER_MODEL_ID: 'glm-5.2:cloud'
      CLASSIFIER_OLLAMA_BASE_URL: 'http://192.168.50.231:11434'
      # Per-tool-call payload logging: the arms differ in WHICH tools they
      # call and in what order, which the [latency] line only counts.
      ENABLE_USAGE_LOGGING: 'true'
      UPLOAD_TTL_DAYS: '14'
    ports: !override
      - '${LAB_HOST_PORT:-3742}:3000'
    volumes: !override
      - uploads-lab:/app/uploads
      - model-cache-lab:/app/model-cache

  postgres:
    container_name: ask-postgres-lab
    volumes: !override
      - postgres-data-lab:/var/lib/postgresql/data

  redis:
    container_name: ask-redis-lab
    volumes: !override
      - redis-data-lab:/data

  searxng:
    container_name: ask-searxng-lab
    ports: !override
      - '${LAB_SEARXNG_PORT:-3743}:8080'
    volumes: !override
      - ./searxng-limiter.toml:/etc/searxng/limiter.toml
      # Shares prod's engine settings on purpose: the experiment is about
      # flow, so the engine set is held constant with the instance whose
      # behaviour we ultimately care about.
      - ./searxng-settings.yml:/etc/searxng/settings.yml
      - searxng-data-lab:/data

volumes:
  postgres-data-lab:
    name: ask-postgres-data-lab
  redis-data-lab:
    name: ask-redis-data-lab
  uploads-lab:
    name: ask-uploads-lab
  model-cache-lab:
    name: ask-model-cache-lab
  searxng-data-lab:
    name: ask-searxng-data-lab
