name: ask-stack-lab

# Isolated third instance for flow-architecture experiments.
#
# WHY A THIRD INSTANCE: prod and staging both carry the full six-source
# retrieval stack, and tonight's measurements showed source mix and candidate
# pool composition swamp everything else — a 30x model difference and a 5x
# unique-contribution difference between sources were both large enough to
# hide any flow effect. This instance exists to make FLOW the only moving part.
#
# RETRIEVAL IS DELIBERATELY REDUCED TO SEARXNG ALONE. Every other source is
# switched off below. Absolute latencies here therefore do NOT match prod;
# arms are compared against each other, never against prod numbers.

services:
  ask:
    container_name: ask-lab
    environment:
      # --- which control flow to run (see lib/agents/flows) ---------------
      # The whole point of this instance. Set per experiment run.
      FLOW_VARIANT: ${FLOW_VARIANT:-baseline}

      # --- isolation -------------------------------------------------------
      # Anonymous mode so the benchmark harness can POST /api/chat without a
      # browser session. Safe here and nowhere else: this instance is LAN-only,
      # has its own Postgres, and holds no real user data. It is also what
      # makes an unattended multi-hour run possible at all — the alternative is
      # ~250 browser interactions. Browser runs still happen, for UX.
      ENABLE_AUTH: 'false'
      ANONYMOUS_USER_ID: 'lab-harness'
      SEARXNG_API_URL: 'http://ask-searxng-lab:8080'
      # No fallback: a silent failover to another instance's SearXNG would
      # mean an arm was measured against a different index without saying so.
      SEARXNG_FALLBACK_API_URL: ''

      # --- SearXNG ONLY. Everything else off. ------------------------------
      # `environment` beats `env_file`, so these empty values override the
      # keys .env supplies. Each gate treats empty/unset as disabled.
      DEGOOG_ENABLED: 'false'
      # Stays DISABLED — the flow experiment is deliberately SearXNG-only, and
      # turning degoog on here would change the conditions mid-run. The URL is
      # wired anyway so enabling it is a one-word change: the lab has its own
      # instance on :4447 with its own Mullvad exit, precisely so benchmark
      # volume can never burn prod's degoog reputation. Lab is the heaviest
      # search generator in the fleet, so it is the one that most needs its own.
      DEGOOG_API_URL: 'http://192.168.50.231:4447'
      DEGOOG_API_KEY: ''
      TAVILY_API_KEY: ''
      TAVILY_MERGE_ENABLED: 'off'
      # Unsetting the Brave key matters twice: it disables the advanced-path
      # merge AND makes getGeneralSearchProviderType() fall back to searxng,
      # so a type:'general' search stays on SearXNG instead of routing to the
      # Brave provider.
      BRAVE_SEARCH_API_KEY: ''
      BRAVE_MERGE_ENABLED: 'off'
      LANGSEARCH_API_KEY: ''
      LANGSEARCH_MERGE_ENABLED: 'off'
      OLLAMA_SEARCH_ENABLED: 'off'
      OLLAMA_SEARCH_API_KEY: ''

      # --- held constant across every arm ----------------------------------
      # Pinned rather than inherited so an arm can never be accidentally
      # measured against a different model or pool size.
      DEFAULT_CHAT_MODEL: 'kimi-k2.6:cloud'
      SEARXNG_CRAWL_MULTIPLIER: '2'
      # Retired 2026-08-01 — see the result section of
      # docs/superpowers/specs/2026-07-25-source-excerpts-design.md. Off on all
      # three stacks. (Lab actually runs from the ask-flow worktree; this copy
      # is dormant, and is set here so starting lab from this tree cannot
      # silently resurrect the retired behaviour.)
      SEARCH_EXCERPTS_ENABLED: 'false'
      # Shell-settable so the never-run A/B can toggle arms against ONE build:
      #   SEARCH_QUALITY_FILTER=strict docker compose ... up -d ask
      # Note quality-content.ts branches only on `=== 'relaxed'`, so ANY other
      # value ('strict', unset, a typo) selects the strict path. The A/B is
      # therefore relaxed-vs-not-relaxed; 'strict' is a label, not a mode.
      SEARCH_QUALITY_FILTER: ${SEARCH_QUALITY_FILTER:-relaxed}
      # Pre-crawl snippet gate. 'on' enforces, 'shadow' scores without acting,
      # anything else is off (snippet-gate.ts:32). Phase 2 of
      # docs/superpowers/specs/2026-07-26-snippet-gate-design.md was specified
      # and never measured; shell-settable so it can be.
      SEARCH_SNIPPET_GATE: ${SEARCH_SNIPPET_GATE:-off}
      SEARCH_SNIPPET_GATE_TOP_N: ${SEARCH_SNIPPET_GATE_TOP_N:-40}
      CLASSIFIER_MODEL_ID: 'glm-5.2:cloud'
      CLASSIFIER_OLLAMA_BASE_URL: 'http://192.168.50.231:11434'
      # Per-tool-call payload logging: the arms differ in WHICH tools they
      # call and in what order, which the [latency] line only counts.
      ENABLE_USAGE_LOGGING: 'true'
      UPLOAD_TTL_DAYS: '14'

      # --- voice read-aloud (Slice 1) -------------------------------------
      # Lab-only: text users see zero change; these two flags light up the
      # client speak control + the /api/voice/speak route (server flag gates
      # the endpoints, NEXT_PUBLIC_ flag gates the client UI). Points the TTS
      # client at the self-hosted Kokoro service below. Port 8880 is Kokoro-
      # FastAPI's real listen port (its OpenAI-compatible /v1/audio/speech).
      # Fail-open: if ask-tts-lab is down the written answer is unaffected and
      # only audio is missing — there is deliberately NO depends_on on it.
      VOICE_ENABLED: 'true'
      # NOTE: the CLIENT gate NEXT_PUBLIC_VOICE_ENABLED is NOT set here. NEXT_PUBLIC_*
      # vars are inlined by `next build` (which reads .env from the build context) —
      # a runtime compose env is too late for the client bundle, so it would leave
      # the voice UI hidden. It lives in the worktree's .env alongside the other
      # NEXT_PUBLIC_* vars. VOICE_ENABLED above is a server runtime read and is
      # correctly an environment var.
      TTS_SERVICE_URL: 'http://ask-tts-lab:8880'
      # VOICE_TTS_VOICE / VOICE_GIST_MODEL_ID left to code defaults
      # (af_heart / granite4.1:8b).
      # --- voice dictate (Slice 2) ----------------------------------------
      # Whisper STT (speaches) runs on NightFuryX's RTX 2080 Ti, reached over
      # the LAN (not a container in this compose). Server flag VOICE_ENABLED
      # above gates /api/voice/transcribe; the mic UI reuses NEXT_PUBLIC_VOICE_
      # ENABLED (already in .env). Fail-open: if the box is down, dictation just
      # returns to idle and typing is unaffected.
      WHISPER_SERVICE_URL: 'http://192.168.50.17:8788'
      VOICE_STT_MODEL: 'Systran/faster-distil-whisper-large-v3'
    ports: !override
      - '${LAB_HOST_PORT:-3742}:3000'
    volumes: !override
      - uploads-lab:/app/uploads
      - model-cache-lab:/app/model-cache

  # Self-hosted Kokoro-82M TTS for the voice read-aloud feature. CPU image
  # (Kokoro-82M runs acceptably on CPU for a lab and avoids GPU contention;
  # the fleet's GPU compute lives on the external Ollama box, not in this
  # compose project). Exposes the OpenAI-compatible Speech API at
  # POST /v1/audio/speech on port 8880 and GET /health. Pinned by the
  # multi-arch index digest so a rebuild can never silently move the model.
  ask-tts-lab:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest@sha256:fa52dce920c3610c78fccde4f6fa064fb092ae95018cf42b42d84d876655e8d9
    container_name: ask-tts-lab
    # LAN-exposed for direct inspection/smoke-tests, matching the lab's
    # searxng pattern; the app reaches it container-to-container regardless.
    ports:
      - '${LAB_TTS_PORT:-3744}:8880'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8880/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  postgres:
    container_name: ask-postgres-lab
    volumes: !override
      - postgres-data-lab:/var/lib/postgresql/data

  redis:
    container_name: ask-redis-lab
    volumes: !override
      - redis-data-lab:/data

  searxng:
    container_name: ask-searxng-lab
    ports: !override
      - '${LAB_SEARXNG_PORT:-3743}:8080'
    volumes: !override
      - ./searxng-limiter.toml:/etc/searxng/limiter.toml
      # Shares prod's engine settings on purpose: the experiment is about
      # flow, so the engine set is held constant with the instance whose
      # behaviour we ultimately care about.
      - ./searxng-settings.yml:/etc/searxng/settings.yml
      - searxng-data-lab:/data

volumes:
  postgres-data-lab:
    name: ask-postgres-data-lab
  redis-data-lab:
    name: ask-redis-data-lab
  uploads-lab:
    name: ask-uploads-lab
  model-cache-lab:
    name: ask-model-cache-lab
  searxng-data-lab:
    name: ask-searxng-data-lab
