name: ask-stack

services:
  ask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ask
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-morphic}:${POSTGRES_PASSWORD:-morphic}@postgres:5432/${POSTGRES_DB:-morphic}
      # The application runtime connects through this URL. When it points at the
      # non-superuser `app_user` role (supplied per stack via .env, which holds
      # the secret), RLS is ENFORCED — cross-user access is denied at the
      # database, not merely by app-layer predicates. Migrations and the
      # file/ingest worker still use DATABASE_URL (owner) via the dbAdmin client.
      # Falls back to the owner URL when .env does not set it, preserving the
      # pre-split behaviour on any stack that has not created the role yet.
      DATABASE_RESTRICTED_URL: ${DATABASE_RESTRICTED_URL:-postgresql://${POSTGRES_USER:-morphic}:${POSTGRES_PASSWORD:-morphic}@postgres:5432/${POSTGRES_DB:-morphic}}
      DATABASE_SSL_DISABLED: 'true'
      ENABLE_AUTH: 'true'
      MORPHIC_CLOUD_DEPLOYMENT: 'false'
      LOCAL_REDIS_URL: redis://redis:6379
      # --- voice (read-aloud + dictate) — shared self-hosted services -----
      # Server flag gates /api/voice/{speak,transcribe}; the client mic/speak UI
      # is gated by NEXT_PUBLIC_VOICE_ENABLED (build-inlined via each stack's
      # .env, NOT here). TTS = shared Kokoro on the app host (:8890); STT =
      # shared Whisper on NightFuryX's 2080 Ti (:8788) — both reached over the
      # LAN like the reranker. Fail-open: a voice outage never blocks text.
      # Applies to prod (base) + staging (overlay merges base); the lab overlay
      # overrides TTS/WHISPER to its own lab services.
      VOICE_ENABLED: 'true'
      TTS_SERVICE_URL: 'http://192.168.50.17:8890'
      WHISPER_SERVICE_URL: 'http://192.168.50.17:8788'
      VOICE_STT_MODEL: 'Systran/faster-distil-whisper-large-v3'
      # Pin the image EDIT model to one consistent, strong editor instead of
      # round-robining the whole pool (registry.ts pickPinnedModel) — edits
      # drifted in style/identity/resolution turn-to-turn. Generation still
      # rotates for variety. nano-banana-2: fast (~20s), renowned for editing,
      # preserves the subject, PNG output, supports match_input_image. gpt-image-2
      # was tried first but times out >120s at usable quality. Applies to prod
      # (base) and staging (overlay merges the base env); lab sets it too.
      REPLICATE_IMAGE_EDIT_MODEL: google/nano-banana-2
      # Stated explicitly rather than left to the default. The gate in
      # lib/utils/degoog-client.ts is opt-OUT (`!== 'false'`), so an unset var
      # here would silently turn degoog on for prod's advanced path on the next
      # deploy — a behaviour change nobody decided and nobody could later find.
      #
      # ON because degoog is not redundant: 7 of its enabled engines (reddit,
      # hacker news, lemmy, internet archive, wikimedia commons, nasa images,
      # openverse) are sources SearXNG is never asked for, and
      # merge-degoog.ts promotes exactly those ahead of mainstream results so
      # they survive truncation.
      #
      # It is not free — degoog inflates the candidate pool, and
      # SEARXNG_CRAWL_MULTIPLIER shows candidates cost real crawl time on
      # staging's crawler (mult 4 -> 76 candidates -> 15-35s fetch). Prod uses
      # a DIFFERENT crawler (crawl4ai on the app host, not .17), so that curve
      # does not transfer. Measure prod's own candidate/crawl response before
      # tuning SEARXNG_CRAWL_MULTIPLIER here.
      DEGOOG_ENABLED: 'true'
      # Candidate-pool cap = maxResults x this, so 4 -> 80 candidates.
      #
      # RAISED 2 -> 4 on 2026-07-28 because the POOL COMPOSITION changed under
      # it. External sources merge FIRST and so win the cap, and there are now
      # four of them: Ollama 10 (raised from 5) + Brave 10 + Tavily 5 +
      # LangSearch 10 = 35. At a 40 cap that left FIVE slots for SearXNG's ~291
      # results and degoog's ~50 — the free self-hosted sources that measured
      # the highest unique contribution (degoog 36-63 URLs no other source
      # found, across three query types). The cap was silently evicting the
      # best-yielding sources to make room for the metered ones.
      #
      # The earlier 4 -> 2 measurement (3 paired queries: -19.0s, -3.2s,
      # -11.3s) predates that composition and predates Ollama-at-10, whose
      # results are prefetched and therefore REMOVE pages from the crawler.
      # Crawl at 80 is also cheaper than that measurement implied: a direct
      # benchmark put 30-45 real pages at 4.5-10s, with wall-clock dominated by
      # a few slow pages rather than by page count, and every concurrency shape
      # tested returned the same usable count.
      #
      # REVERTED 4 -> 2 on 2026-07-28. The 4 above was argued from the 25-turn
      # staging benchmark (median 60.0s), and that benchmark is NOT VALID for
      # prod: staging ran every one of those turns on deepseek-v4-flash:cloud
      # via a stale saved preference, while prod runs kimi-k2.6:cloud. The two
      # models differ ~30x in prompt-processing rate — 36.1 vs 1098.3 ms per
      # 1000 prompt tokens, measured from ingest_ms/prompt_tokens on each
      # instance.
      #
      # That difference is what makes pool size expensive HERE and cheap there.
      # More candidates -> more returned sources -> more context, and on prod
      # every extra 1k prompt tokens costs about 1.1s before the model writes a
      # word. A prod turn carrying 64k prompt tokens spends ~70s just reading.
      # Crawl is not the binding cost on this model; context is.
      #
      # So 2 stands until there is a prod-side measurement on prod's own model.
      # The pool-composition problem that motivated 4 is REAL and unresolved:
      # external sources merge first and now total 35 (Ollama 10 + Brave 10 +
      # Tavily 5 + LangSearch 10), leaving only 5 of 40 slots for SearXNG and
      # degoog, which measured the highest unique contribution. Fixing that by
      # widening the pool trades a retrieval problem for a much larger context
      # problem on this model; fix it by ordering or per-source caps instead.
      #
      # Do NOT go to 1: starving the first search made the model issue 6 tool
      # calls instead of 4 and the turn came out 19s SLOWER, because a model
      # round-trip costs ~7s and dwarfs the crawl saved.
      SEARXNG_CRAWL_MULTIPLIER: '2'
      # Let the cross-encoder judge relevance instead of a word-count heuristic.
      #
      # The strict rule is the single largest cut in the pipeline — measured at
      # 42 crawled pages down to 18 usable — and it discards exactly the pages
      # this engine is asked for: spec tables (almost no sentence-ending
      # punctuation, so words-per-sentence explodes past the 30 ceiling) and
      # numbered procedures (short imperative steps, so it falls under the 5
      # floor). Re-measured 2026-07-28: a 337-char spec/price table and a
      # perfectly ordinary 328-char prose article were both DROPPED by strict,
      # the latter for being 49 words against a >50 threshold.
      #
      # `relaxed` was built and tested for precisely this and then never
      # enabled anywhere — prod omitted the variable and the other two stacks
      # set 'strict', which quality-content.ts treats as unset because it
      # branches only on `=== 'relaxed'`. So the fix has been sitting dormant
      # behind a value that looked like configuration.
      #
      # The relaxed case rested on crawl cost being bounded by remote-site tail
      # latency rather than page count (12 pages 9.1s vs 55 pages 13.1s) and on
      # admitted pages being short. That accounting only covers CRAWL time. It
      # says nothing about what the surviving pages cost once they reach the
      # model, which is the expensive part.
      #
      # HELD AT STRICT ON PROD, 2026-07-28. Turn latency correlates with
      # prompt_tokens at r=0.76 across 65 turns with usage recorded (<20k
      # median 12.5s; >120k median 107.2s, max 217.5s), and turns that died at
      # the 300s ceiling record no usage at all, so the real curve is worse
      # than that. Relaxing admits more pages, which grows context. Whether the
      # reranker's own cap absorbs that is UNMEASURED.
      #
      # This is a hypothesis with a mechanism, not a result — which is exactly
      # why prod is the wrong place to carry it. Staging and lab stay on
      # 'relaxed' so the A/B can be run there. Flip this back once that A/B
      # shows the added coverage does not cost turn latency.
      #
      # NOTE the value is cosmetic: quality-content.ts branches only on
      # `=== 'relaxed'`, so 'strict' and unset are the same code path. It is
      # written out to make the intent legible in the diff.
      SEARCH_QUALITY_FILTER: 'strict'
      # Crop-position shadow + 20k crop, shipped to prod+staging for a
      # real-traffic read on how much of the crop's discarded tail is signal.
      # Shadow-only: never changes answers, runs after the response (measures
      # where each cited source's best passage sits vs the crop). Both
      # shell-overridable — SEARCH_ENRICH_MAX_CHARS=10000 reverts the crop.
      SEARCH_ENRICH_MAX_CHARS: ${SEARCH_ENRICH_MAX_CHARS:-20000}
      SEARCH_CROP_POSITION_SHADOW: ${SEARCH_CROP_POSITION_SHADOW:-true}
    ports:
      - '${HOST_PORT:-3738}:3000'
    volumes:
      - uploads:/app/uploads
      - model-cache:/app/model-cache
    networks:
      # shared-infra is joined so the fetch rescue chain can reach the
      # flaresolverr and crawl4ai containers (both loopback-bound on the
      # host, so only reachable container-to-container). See
      # lib/utils/flaresolverr.ts.
      - default
      - shared-infra
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      searxng:
        condition: service_started
    healthcheck:
      # Liveness only — GET /api/health does not touch Postgres/Redis, so this
      # catches a WEDGED event loop (which a bare "running" status hides) without
      # flapping the app unhealthy on a dependency blip. Uses node, always present
      # in the image, so it does not rely on curl/wget being installed. Overlays
      # inherit this block, so every env gets it. NOTE: Docker only MARKS the
      # container unhealthy — it does not restart on it; pair with an autoheal
      # sidecar or a monitor (uptime-kuma) to act on the signal.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: ask-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morphic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morphic}
      POSTGRES_DB: ${POSTGRES_DB:-morphic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-morphic}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ask-redis
    volumes:
      - redis_data:/data
    # Bounded, but deliberately NOT evicting. 256mb is ~140x current usage
    # (1.7-3.5mb across the three stacks), so it is a backstop against runaway
    # growth, not a working limit.
    #
    # noeviction is kept on purpose. The obvious choice, allkeys-lru, would be
    # wrong here: this Redis holds `tavily:budget:YYYY-MM`, `brave:budget:...`
    # and `langsearch:budget:...` — monthly API spend meters with ~30 day TTLs.
    # Evicting one resets the meter to zero, and the app then believes it has
    # spent nothing and overspends a paid quota. volatile-lru is no safer: those
    # keys are exactly the ones carrying a TTL.
    #
    # With noeviction the failure mode at the ceiling is a rejected write, which
    # every caller already handles (createDurableSink catches; cache writes are
    # best-effort). A loud, recoverable failure beats a silent budget reset.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    restart: unless-stopped

  # Locally-bundled SearXNG instance, used as an automatic failover target
  # when the primary instance (SEARXNG_API_URL, typically an existing
  # external SearXNG deployment) is unreachable. See SEARXNG_FALLBACK_API_URL
  # in .env and lib/utils/searxng-client.ts for the failover logic.
  searxng:
    image: searxng/searxng
    container_name: ask-searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    # LAN-only UI so this instance can be inspected directly — which engines
    # answer, which CAPTCHA — instead of inferring it from Ask's logs. It was
    # previously unreachable from the host, so the only browsable instance was
    # the PUBLIC searxng (search.hbqnexus.win), which is a different instance
    # on a different egress IP and therefore not evidence about this one.
    #
    # Read-only UI; it changes nothing about how Ask queries this instance.
    # Staging overrides this away — see docker-compose.admin-feature.yaml.
    ports:
      - '3741:8080'
    volumes:
      - ./searxng-limiter.toml:/etc/searxng/limiter.toml
      - ./searxng-settings.yml:/etc/searxng/settings.yml
      - searxng_data:/data
    restart: unless-stopped

networks:
  shared-infra:
    name: shared-infra
    external: true

volumes:
  postgres_data:
    name: ask-postgres-data
  redis_data:
    name: ask-redis-data
  uploads:
    name: ask-uploads
  model-cache:
    name: ask-model-cache
  searxng_data:
    name: ask-searxng-data
