name: ask-stack

services:
  ask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ask
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-morphic}:${POSTGRES_PASSWORD:-morphic}@postgres:5432/${POSTGRES_DB:-morphic}
      DATABASE_RESTRICTED_URL: postgresql://${POSTGRES_USER:-morphic}:${POSTGRES_PASSWORD:-morphic}@postgres:5432/${POSTGRES_DB:-morphic}
      DATABASE_SSL_DISABLED: 'true'
      ENABLE_AUTH: 'true'
      MORPHIC_CLOUD_DEPLOYMENT: 'false'
      LOCAL_REDIS_URL: redis://redis:6379
      # Stated explicitly rather than left to the default. The gate in
      # lib/utils/degoog-client.ts is opt-OUT (`!== 'false'`), so an unset var
      # here would silently turn degoog on for prod's advanced path on the next
      # deploy — a behaviour change nobody decided and nobody could later find.
      #
      # ON because degoog is not redundant: 7 of its enabled engines (reddit,
      # hacker news, lemmy, internet archive, wikimedia commons, nasa images,
      # openverse) are sources SearXNG is never asked for, and
      # merge-degoog.ts promotes exactly those ahead of mainstream results so
      # they survive truncation.
      #
      # It is not free — degoog inflates the candidate pool, and
      # SEARXNG_CRAWL_MULTIPLIER shows candidates cost real crawl time on
      # staging's crawler (mult 4 -> 76 candidates -> 15-35s fetch). Prod uses
      # a DIFFERENT crawler (crawl4ai on the app host, not .17), so that curve
      # does not transfer. Measure prod's own candidate/crawl response before
      # tuning SEARXNG_CRAWL_MULTIPLIER here.
      DEGOOG_ENABLED: 'true'
      # Candidate-pool cap = maxResults x this, so 2 -> 40 candidates crawled.
      # Default is 4 (=80).
      #
      # On prod this is a TAIL CLAMP, not a median speedup: prod's candidate
      # median is 36 (n=18), already under the cap, so roughly half of turns are
      # untouched. What it removes is the top end - 60 and 77 candidate turns
      # crawling 18.9-21.7s, against a worst recorded crawl of 63.8s.
      #
      # Measured on staging, 3 paired queries, mult 4 -> 2: -19.0s, -3.2s,
      # -11.3s (median 88.1s -> 85.0s). Do NOT go to 1: starving the first
      # search made the model issue 6 tool calls instead of 4 and the turn came
      # out 19s SLOWER, because a model round-trip costs ~7s and dwarfs the
      # crawl saved.
      #
      # 40 also lands exactly on crawl4ai's pool.max_pages semaphore (see
      # crawl4ai/config.yml), so staying at or under it avoids queueing - which
      # may be as much of the win as crawling fewer pages.
      SEARXNG_CRAWL_MULTIPLIER: '2'
    ports:
      - '${HOST_PORT:-3738}:3000'
    volumes:
      - uploads:/app/uploads
      - model-cache:/app/model-cache
    networks:
      # shared-infra is joined so the fetch rescue chain can reach the
      # flaresolverr and crawl4ai containers (both loopback-bound on the
      # host, so only reachable container-to-container). See
      # lib/utils/flaresolverr.ts.
      - default
      - shared-infra
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      searxng:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: ask-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morphic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morphic}
      POSTGRES_DB: ${POSTGRES_DB:-morphic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-morphic}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ask-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Locally-bundled SearXNG instance, used as an automatic failover target
  # when the primary instance (SEARXNG_API_URL, typically an existing
  # external SearXNG deployment) is unreachable. See SEARXNG_FALLBACK_API_URL
  # in .env and lib/utils/searxng-client.ts for the failover logic.
  searxng:
    image: searxng/searxng
    container_name: ask-searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    # LAN-only UI so this instance can be inspected directly — which engines
    # answer, which CAPTCHA — instead of inferring it from Ask's logs. It was
    # previously unreachable from the host, so the only browsable instance was
    # the PUBLIC searxng (search.hbqnexus.win), which is a different instance
    # on a different egress IP and therefore not evidence about this one.
    #
    # Read-only UI; it changes nothing about how Ask queries this instance.
    # Staging overrides this away — see docker-compose.admin-feature.yaml.
    ports:
      - '3741:8080'
    volumes:
      - ./searxng-limiter.toml:/etc/searxng/limiter.toml
      - ./searxng-settings.yml:/etc/searxng/settings.yml
      - searxng_data:/data
    restart: unless-stopped

networks:
  shared-infra:
    name: shared-infra
    external: true

volumes:
  postgres_data:
    name: ask-postgres-data
  redis_data:
    name: ask-redis-data
  uploads:
    name: morphic-uploads
  model-cache:
    name: ask-model-cache
  searxng_data:
    name: ask-searxng-data
