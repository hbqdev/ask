name: ask-stack-admin-feature

services:
  ask:
    container_name: ask-admin-feature
    # Enable the chat-idle upload TTL on staging only (prod uses the base
    # compose alone and stays opt-in via its own .env at deploy time). Merges
    # with the base service's environment block.
    environment:
      # Defaults to 'true' — staging binds 0.0.0.0:3739 and is LAN-visible, so
      # it must never sit unauthenticated. Overridable from the shell ONLY for
      # bounded, attended experiments that need to drive real turns without a
      # login (e.g. the source-excerpts A/B), then restored immediately:
      #   ENABLE_AUTH=false docker compose ... up -d ask   # run, then re-up
      ENABLE_AUTH: ${ENABLE_AUTH:-true}
      UPLOAD_TTL_DAYS: '14'
      # staging gets its own SearXNG, isolated from prod's and from personal use
      SEARXNG_API_URL: 'http://ask-searxng-admin-feature:8080'
      # Send the answering model each source's top-ranked passages instead of
      # the whole crawled page.
      #
      # NOT staging-only, despite what this comment claimed until 2026-08-01:
      # prod's .env sets the same value, so prod has been running excerpts too
      # and the "staging vs prod" excerpt comparison compared identical arms.
      # The deciding A/B in 2026-07-25-source-excerpts-design.md was never run —
      # 2026-07-26-full-content-in-history-design.md:172 still lists the ship
      # decision as pending. Shell-settable so that A/B can toggle arms against
      # ONE build, as the spec requires, without editing this file mid-run:
      #   SEARCH_EXCERPTS_ENABLED=true docker compose ... up -d ask
      #
      # Default flipped to false on 2026-08-01 by the A/B this flag was created
      # for. Per-step prompt size fell only 5% — the entire point of the change —
      # while steps rose 142%, turns ran 17% slower, and citation-without-support
      # reproduced on two of two probed turns (GPU specs and Next.js claims both
      # attributed to the previous turn's Kubernetes page). Full result in
      # docs/superpowers/specs/2026-07-25-source-excerpts-design.md.
      SEARCH_EXCERPTS_ENABLED: ${SEARCH_EXCERPTS_ENABLED:-false}
      # Let the cross-encoder judge relevance instead of a word-count
      # heuristic. Strict drops >50% of crawled pages, including spec tables
      # and numbered procedures.
      #
      # Was 'strict' until 2026-07-28, which is a NO-OP: quality-content.ts
      # branches on `=== 'relaxed'` and nothing else, so 'strict' takes the
      # same path as unset. The comment above described the intended behaviour
      # while the value silently did the opposite, and because prod merely
      # omits the variable, all three stacks were running identical strict
      # behaviour that looked deliberately configured on two of them.
      SEARCH_QUALITY_FILTER: 'relaxed'
      # Classifier on a cloud model. Re-bake-off 2026-09-03 across all seven
      # stack cloud models on ground-truth cases: deepseek-v4-pro:cloud is the
      # fastest USABLE one (925ms isolated / ~1.1-1.3s real-turn), with gating
      # identical to local granite and a better follow-up rewrite. It replaces
      # glm-5.3-flash:cloud, which was ~2.2s and spiked to ~10s on the
      # rewrite+expansion follow-up turn. (kimi-k3/minimax returned empty/failed
      # tool-calls; qwen3.5:397b + kimi-k2.6 were slower.)
      # Cloud models are proxied through the main Ollama host, not the
      # dedicated classifier host.
      CLASSIFIER_MODEL_ID: 'deepseek-v4-pro:cloud'
      CLASSIFIER_OLLAMA_BASE_URL: 'http://192.168.50.231:11434'
      # Pre-crawl snippet gate, ENFORCING. Phase 2 of
      # docs/superpowers/specs/2026-07-26-snippet-gate-design.md.
      #
      # Phase 1 shadow ran 17 turns / 227 returned sources on staging and the
      # retention curve converged (checkpoints at 7/10/14/17 within ~1pp).
      # N=40 is the knee: it keeps 95.2% of the sources that actually reached
      # an answer while cutting the crawl 55 -> 37 pages. N=45 buys 2.6pp more
      # retention for 9s of the saving; N=35 gives up 5pp for nothing extra.
      #
      # Projected net ~+10.9s/turn (est. 13.6s less crawl against the gate's
      # measured 2.7s). Projected, not measured — that is what this phase is
      # for. Compare crawl_ms / returned / total_ms against the shadow run
      # before this goes anywhere near prod.
      # Emits one [PAYLOAD] line per tool call with the tool name and a token
      # breakdown (lib/utils/usage-logging.ts). Off by default and staging-only:
      # the structured telemetry records tool_calls as a COUNT, so a 17-tool-call
      # turn is opaque about which tools ran. At ~7s of model round-trip per
      # step, knowing whether those were searches, fetches or todoWrite
      # bookkeeping decides what is worth capping.
      ENABLE_USAGE_LOGGING: 'true'
      SEARCH_SNIPPET_GATE: 'off'
      SEARCH_SNIPPET_GATE_TOP_N: '40'
      # Passthrough so the crawl budget can be swept from the shell without
      # editing this file: MAX_ENRICH_URLS=20 docker compose ... up -d ask.
      # Default 100 matches the route's own fallback, so an unset shell var
      # changes nothing. Added for the crawl-cost experiment the snippet gate
      # should have started with — it is the one knob that moves page count
      # directly, holding the query fixed.
      MAX_ENRICH_URLS: ${MAX_ENRICH_URLS:-100}
      # Same passthrough for the candidate pool itself. This is the knob that
      # reduces WORK rather than relocating it: MAX_ENRICH_URLS only decides
      # which crawler a candidate goes to (Crawl4AI above the split, the legacy
      # in-process scraper below it), so lowering it moves cost from crawl_ms
      # into enrich_ms. Lowering the multiplier shrinks `candidates`, so pages
      # never reach either crawler. Default 4 matches the route's fallback.
      SEARXNG_CRAWL_MULTIPLIER: ${SEARXNG_CRAWL_MULTIPLIER:-4}
      # Re-enable degoog on the advanced path. It was switched off 2026-07-25
      # because it scraped Google/Brave/Startpage/DDG from our residential IP
      # and burned the reputation SearXNG depends on — see the comment on
      # DEGOOG_ENABLED in app/api/advanced-search/route.ts. That coupling is
      # gone: degoog now egresses its own Mullvad tunnel (23.234.110.201,
      # us-atl-wg-406) while Ask's SearXNG uses us-was-wg-001/002, so the two
      # no longer share a per-IP quota with each other or with browsing.
      #
      # What it buys: 7 engines SearXNG never queries — reddit, hacker news,
      # lemmy, internet archive, wikimedia commons, nasa images, openverse.
      # merge-degoog.ts promotes exactly those ahead of mainstream results so
      # they survive truncation; the mainstream ~60% dedupes away against
      # SearXNG's own hits.
      #
      # Staging only, pending the A/B on candidates/crawl_ms/returned. The
      # fan-out itself is parallel and nearly free, but extra candidates feed
      # the crawler, which is already 55-70% of turn latency.
      DEGOOG_ENABLED: 'true'
      # Staging's OWN degoog instance, on its own Mullvad exit. Overrides the
      # value in ask/.env, which both stacks share and which now points at
      # prod's instance (:4445).
      #
      # Until 2026-07-28 every stack pointed at https://nogoog.hbqnexus.win —
      # the PUBLIC instance — so Ask's scraping and strangers' searches shared
      # one exit IP and one reputation, and each could get the other
      # rate-limited. Same isolation the per-stack SearXNG instances already
      # had. Going over the LAN also drops a Cloudflare round trip from every
      # search.
      DEGOOG_API_URL: 'http://192.168.50.231:4446'
      # Staging used to crawl via NightFuryX (.17) on the theory that a
      # Threadripper 3970X with 64 threads would beat the app host's laptop i7.
      # Measured head-to-head 2026-07-27 — same 16 urls, same config, cache
      # bypassed, 4 reps each, both returning 15/16 and ~940k chars — it does
      # not:
      #
      #   app host   3199 / 2860 / 2535 / 2356 ms   median 2698   (5.0-6.8 pg/s)
      #   .17        3289 / 8043 / 7057 / 3497 ms   median 5277   (2.0-4.9 pg/s)
      #
      # The app host is ~2x faster and far steadier, and .17 was idle at the
      # time (load 0.68, 1.65G of 32G used) so it was not contention. Crawling
      # is I/O-bound — it waits on remote servers, so extra cores buy nothing —
      # and routing to .17 adds a LAN round trip carrying ~940KB of markdown per
      # batch. The old "plateaued at ~4.1 pages/sec" note still reproduces for
      # .17; the app host has simply moved past it.
      #
      # Matching prod also makes staging COMPARABLE to prod, which is the point
      # of staging. Every crawl figure measured here before this date was
      # inflated ~2x, with much worse variance (8043 vs 2356 ms on identical
      # work), which is likely part of why the snippet gate A/B could not
      # resolve its effect at n=14-17.
      #
      # .17 keeps the cross-encoder reranker on :8787, which IS compute-bound
      # and where that box actually earns its place.
      CRAWL4AI_URL: 'http://crawl4ai:11235'
    ports: !override
      - '${ADMIN_FEATURE_HOST_PORT:-3739}:3000'
    volumes: !override
      - uploads-admin-feature:/app/uploads
      - model-cache-admin-feature:/app/model-cache

  postgres:
    container_name: ask-postgres-admin-feature
    volumes: !override
      - postgres-data-admin-feature:/var/lib/postgresql/data

  redis:
    container_name: ask-redis-admin-feature
    volumes: !override
      - redis-data-admin-feature:/data

  searxng:
    container_name: ask-searxng-admin-feature
    # Drop the base compose's 3741 publish. Two containers cannot bind the same
    # host port, and once the VPN overlay puts this one in gluetun's network
    # namespace it cannot own ports at all — compose refuses the combination.
    # Staging's UI is published on gluetun as 3740 instead.
    ports: !override []
    volumes: !override
      - ./searxng-limiter.toml:/etc/searxng/limiter.toml
      # Staging gets its OWN settings file. Both composes previously mounted
      # ./searxng-settings.yml, so there was no way to stage an engine change:
      # every edit hit the file prod mounts, and took effect on prod's next
      # restart. Engine edits go here first, then get copied to the prod file.
      - ./searxng-settings.admin-feature.yml:/etc/searxng/settings.yml
      - searxng-data-admin-feature:/data

volumes:
  postgres-data-admin-feature:
    name: ask-postgres-data-admin-feature
  redis-data-admin-feature:
    name: ask-redis-data-admin-feature
  uploads-admin-feature:
    name: ask-uploads-admin-feature
  model-cache-admin-feature:
    name: ask-model-cache-admin-feature
  searxng-data-admin-feature:
    name: ask-searxng-data-admin-feature
