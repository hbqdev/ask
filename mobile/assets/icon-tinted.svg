<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Tinted Home-screen icon: icon.svg's mark in greys on transparent. iOS
       reads it as luminance and applies the user's tint; the three greys
       keep the bodies apart where they overlap. -->
  <g transform="translate(50 50) scale(1.32) translate(-50 -51)">
    <circle cx="39" cy="43" r="17" fill="#ffffff" />
    <circle cx="66" cy="39" r="12" fill="#d0d0d0" />
    <circle cx="53" cy="67" r="9" fill="#a8a8a8" />
  </g>
</svg>
