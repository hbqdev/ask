<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!-- Launch screen, dark appearance: the page's dark background
       (oklch(0.1 0.022 289) = #030309) with the three-body mark centred.
       Scaled to fill (aspect fill) on every device, so the mark stays small.
       The light variant is splash-light.svg. Hex colours only: sips misreads
       hsl(). -->
  <rect width="2732" height="2732" fill="#030309" />
  <g transform="translate(1366 1366) scale(5) translate(-50 -51)">
    <circle cx="39" cy="43" r="17" fill="#3694f2" />
    <circle cx="66" cy="39" r="12" fill="#944fee" />
    <circle cx="53" cy="67" r="9" fill="#f4882a" />
  </g>
</svg>
