<!doctype html>
<html lang="en">
  <head>

    <title>Ask</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0c0a14;
        color: #e8e6f0;
        font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px; box-sizing: border-box;
      }
      svg { width: 72px; height: 72px; margin-bottom: 20px; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #a9a4bd; }
      button {
        font: inherit; font-weight: 600; color: #0c0a14; background: #e8e6f0;
        border: 0; border-radius: 999px; padding: 12px 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="39" cy="43" r="17" fill="#3694f2" />
        <circle cx="66" cy="39" r="12" fill="#944fee" />
        <circle cx="53" cy="67" r="9" fill="#f4882a" />
      </svg>
      <h1>Can't reach Ask</h1>
      <p>Check your connection, then try again.</p>
      <button onclick="location.href = 'https://ask.hbqnexus.win/'">Try again</button>
