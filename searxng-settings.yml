use_default_settings: true
server:
  # Is overwritten by ${SEARXNG_PORT} and ${SEARXNG_BIND_ADDRESS}
  port: 8888
  bind_address: '0.0.0.0'
  # public URL of the instance, to ensure correct inbound links. Is overwritten
  # by ${SEARXNG_URL}.
  base_url: false # "http://example.com/location"
  # rate limit the number of request on the instance, block some bots.
  # Is overwritten by ${SEARXNG_LIMITER}
  limiter: false
  # enable features designed only for public instances.
  # Is overwritten by ${SEARXNG_PUBLIC_INSTANCE}
  public_instance: false

  # If your instance owns a /etc/searxng/settings.yml file, then set the following
  # values there.

  secret_key: 'ursecretkey' # Is overwritten by ${SEARXNG_SECRET}
  # Proxy image results through SearXNG. Is overwritten by ${SEARXNG_IMAGE_PROXY}
  image_proxy: false
  # 1.0 and 1.1 are supported
  http_protocol_version: '1.0'
  # POST queries are more secure as they don't show up in history but may cause
  # problems when using Firefox containers
  # GET so the LAN UI (prod :3741, staging :3740) is usable and its result
  # URLs are shareable. With POST, any /search?q=... returns 403 — verified
  # from INSIDE the container too, so it was never the limiter or a proxy
  # header, both of which we chased first.
  #
  # POST's benefit is keeping queries out of browser history. These instances
  # are LAN-only diagnostic surfaces, so that is worth trading for a UI that
  # actually opens.
  method: 'GET'
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

search:
  # json for Ask, html for the LAN UI (prod :3741, staging :3740). Without
  # html EVERY browser search returns 403 "You don't have the permission to
  # access the requested resource" — by design, not a bug, and it fires before
  # the search runs so nothing appears in the engine logs to explain it.
  # Verified from inside the container too, which is what ruled out the
  # limiter, the missing X-Forwarded-For header and the POST method, all of
  # which look like the culprit and are not.
  formats:
    - json
    - html
  # WITHOUT THIS, DUCKDUCKGO IS DEAD. SearXNG passes the default language
  # straight through as DDG's `kl` region parameter, and with no default set it
  # sends `wt-wt` (no region), which DDG answers with a CAPTCHA every time. That
  # is literally what prod's log says: `CAPTCHA (wt-wt) (suspended_time=0)`,
  # 112 times in 72h. `default_lang: 'all'` is the same thing under another
  # name and fails identically.
  #
  # Established 2026-07-28 on a throwaway instance with the exit IP PINNED
  # (us-mkc-wg-004) so the address could not be the hidden variable — an
  # earlier unpinned run redrew a random exit per arm and produced two
  # contradictory "fixes". On one fixed IP: prod-verbatim 0 results (repeated
  # first and last, both 0), +default_lang 10 results, +relaxed outgoing
  # timeouts 0. Per-engine `language:` is not a valid key — the container
  # refuses to boot.
  #
  # This is NOT an English-only tax. Measured on the Vietnamese probe query,
  # en-US went from 41 results / 31 Vietnamese-script titles to 55 / 44: the
  # query's own language drives what engines return, while this only sets the
  # region handed to engines that demand one. Ask sends no language parameter
  # of its own, so this setting governs every search.
  default_lang: 'en-US'

# Enable discussion-intent engines (disabled in upstream defaults) so the
# local fallback matches the primary instance for Ask's engine routing.
engines:
  # DISABLED 2026-07-28. SearXNG's wikipedia engine answers with an INFOBOX and
  # never result rows — measured `results: 0` across four query shapes — and Ask
  # reads only `data.results`, never `infoboxes`. So it costs a round trip on
  # every advanced search to contribute literally nothing.
  #
  # Removing it from SEARXNG_ENGINES_ADVANCED was NOT enough and did nothing on
  # its own: SearXNG UNIONS `categories` with `engines`, and Ask sends
  # `categories=general`, so every enabled general engine runs regardless of the
  # pin. Proved with the infobox as a tracer — `engines=` alone gives
  # infoboxes=0, `engines=`+`categories=general` gives infoboxes=1 with the pin
  # unchanged. Disabling here is what actually stops it.
  #
  # Left ENABLED on the public instance (searxng/settings.yml): infoboxes are
  # real value in a browser UI, which is the one consumer that reads them.
  - name: wikipedia
    disabled: true
  - name: gentoo # timeout=10, niche distro engine, chronic slow responder
    disabled: true
  - name: hackernews
    disabled: false
  - name: lobste.rs
    disabled: false
  # bing is in SEARXNG_ENGINES_ADVANCED ('bing,duckduckgo,wikipedia,google cse')
  # but ships DISABLED in upstream defaults — so Ask requested it on every
  # advanced search and got nothing back. With brave rate-limited and startpage
  # CAPTCHA'd from this IP, that left DuckDuckGo carrying the whole result set.
  - name: bing
    disabled: false
  # DISABLED 2026-07-28. The note below was written while this instance was on
  # a residential IP and is no longer true of it: from behind Mullvad, mojeek
  # answers HTTP 403 "access denied" (66 log lines in 72h, suspended_time=180),
  # exactly like startpage.
  #
  # It also never reached Ask in the first place — Ask pins an explicit
  # `engines=` list (lib/tools/search/engines.ts) that has never contained
  # mojeek, so this only ever served the LAN browser UI, where it now costs a
  # round trip to return nothing.
  #
  # Worth knowing when reading a probe: once suspended it reports 0 results
  # with `unresponsive: none`, so it looks healthy-but-empty rather than
  # blocked until the suspension lapses and it retries.
  #
  # Original rationale, kept because it becomes true again on a residential
  # exit: independent crawler with its own index — not a Google/Bing reseller,
  # and it does not rate-limit residential IPs the way brave/startpage/google
  # do. Adds a source of results that survives when the blocked engines do not.
  - name: mojeek
    disabled: true
  # DISABLED 2026-07-27. Startpage redirects to a CAPTCHA from every Mullvad
  # exit we have used, and when it does it suspends for 3600s — the longest
  # cooldown of any engine here, so one hit takes it out for the rest of the
  # hour anyway. That makes it a round trip spent to return nothing on
  # essentially every search. No loss of coverage: startpage is a Google
  # reseller and `google cse` already serves that index from an endpoint that
  # is not blocked from these IPs.
  - name: startpage
    disabled: true
  # Measured 2026-07-26 and left DISABLED: qwant returns CAPTCHA from this IP
  # (same as brave/startpage), and presearch returned 0 results without even
  # reporting itself unresponsive. Both cost a round trip per search for
  # nothing — an engine that hangs is worse than an absent one, because the
  # search waits on it.

# Bound per-engine timeout so one slow/hanging engine (e.g. DuckDuckGo
# timing out under the 'it' category) can't hold the whole response past
# Ask's 8s SearXNG fetch timeout and force an empty-result abort.
outgoing:
  request_timeout: 4.0
  max_request_timeout: 5.0
